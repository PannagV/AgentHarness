[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker"
version = "0.1.0"
description = "A terminal harness for local OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp[client]>=4.0.10",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "openai>=3.20.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
icebreaker = "cli:main"

[tool.setuptools]
py-modules = [
    "cli",
    "main",
    "config",
    "input_ui",
    "logger",
    "skills_manager",
    "mcp_manager",
]
